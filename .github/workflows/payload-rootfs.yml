name: Build S10 5G Payload (with root.apfs)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: /home/runner/theos
    steps:
      - name: Clonar scion-kernel
        uses: actions/checkout@v4

      - name: Verificar que exista userland/root.apfs
        run: |
          if [ ! -f userland/root.apfs ]; then
            echo "ERROR: Falta subir userland/root.apfs al repositorio."
            exit 1
          fi
          ls -lh userland/root.apfs

      - name: Instalar dependencias base
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl tar xz-utils python3 clang lld llvm bison flex gperf rsync bc cpio uuid-dev libssl-dev libtinfo6
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5
          
      - name: Instalar Theos, toolchain y SDKs
        run: |
          git clone --depth 1 https://github.com/theos/theos.git "$THEOS"
          rm -rf "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          mkdir -p "$THEOS/toolchain/linux/iphone"
          curl -L --fail https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma \
            | tar --lzma -x -C "$THEOS/toolchain/linux/iphone" --strip-components=1
          ls -d "$THEOS/sdks/iPhoneOS16.5.sdk"

      - name: Compilar kernel y loader
        run: |
          make kernel loader-open || (echo "=== exporthdrs.log ==="; tail -n 60 xnu-deps/exporthdrs.log 2>/dev/null; exit 1)

      - name: Empaquetar payload.bin con root.apfs
        run: |
          python3 xnuloader/mkpayload.py -o payload.bin \
            kernel=hakios-kernel \
            resident=userland/root.apfs \
            --cmdline "-v debug=0x8 rd=md0 cpus=1"
          ls -lh payload.bin

      - name: Subir payload.bin y loader
        uses: actions/upload-artifact@v4
        with:
          name: s10-5g-payload-root
          path: |
            payload.bin
            xnuloader/loader.efi
          if-no-files-found: warn
